<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Control Remoto para Excavadora IoT" />
  <meta name="theme-color" content="#0b0f17" />
  <title>Control Vehículo IoT · Excavadora IoT</title>

  <!-- Favicon propio del proyecto -->
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />

  <!-- Bootstrap 5.3 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />
  <!-- Estilos personalizados -->
  <link rel="stylesheet" href="./assets/css/style.css?v=5" />
</head>
<body class="app-viewport">

  <!-- HEADER COMPACTO -->
  <header class="app-header">
    <div class="header-inner">
      <div class="d-flex align-items-center gap-2">
        <img src="./assets/favicon.svg" alt="Icono Control IoT" width="26" height="26" class="header-logo" />
        <div>
          <h1 id="vehicle-title" class="header-title mb-0">Excavadora IoT</h1>
        </div>
      </div>
      <button
        id="btn-refresh-health"
        type="button"
        class="btn btn-sm btn-reconnect d-flex align-items-center gap-1"
        title="Comprobar conexión"
        aria-label="Comprobar conexión"
      >
        <i class="bi bi-arrow-clockwise" aria-hidden="true"></i>
        <span>Sincronizar</span>
      </button>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL SIN SCROLL -->
  <main class="app-main">

    <!-- PANEL DE CONECTIVIDAD (3 Indicadores en 1 fila integrada) -->
    <section aria-label="Estado de Conectividad" class="connectivity-bar">
      <div class="status-pill-card">
        <div class="d-flex align-items-center gap-1">
          <span id="status-dot-ws" class="status-dot status-connecting" aria-hidden="true"></span>
          <i id="status-icon-ws" class="bi bi-broadcast text-warning status-icon" aria-hidden="true"></i>
          <span class="status-title">WebSocket</span>
        </div>
        <span id="status-text-ws" class="badge rounded-pill text-bg-warning status-badge" aria-live="polite">
          Conectando
        </span>
      </div>

      <div class="status-pill-card">
        <div class="d-flex align-items-center gap-1">
          <span id="status-dot-api" class="status-dot status-connecting" aria-hidden="true"></span>
          <i id="status-icon-api" class="bi bi-cloud-check text-warning status-icon" aria-hidden="true"></i>
          <span class="status-title">Servidor AWS</span>
        </div>
        <span id="status-text-api" class="badge rounded-pill text-bg-warning status-badge" aria-live="polite">
          Comprobando
        </span>
      </div>

      <div class="status-pill-card">
        <div class="d-flex align-items-center gap-1">
          <span id="status-dot-rds" class="status-dot status-connecting" aria-hidden="true"></span>
          <i id="status-icon-rds" class="bi bi-database-check text-warning status-icon" aria-hidden="true"></i>
          <span class="status-title">Amazon RDS</span>
        </div>
        <span id="status-text-rds" class="badge rounded-pill text-bg-warning status-badge" aria-live="polite">
          Sin verificar
        </span>
      </div>
    </section>

    <!-- ALERTAS FLOTANTES -->
    <div id="alert-container" class="floating-alerts" aria-live="assertive"></div>

    <!-- GRILLA PRINCIPAL DE CONTROL -->
    <div class="control-grid">

      <!-- PANEL IZQUIERDO / SUPERIOR: JOYSTICK Y BOTÓN DETENER -->
      <section class="glass-card panel-joystick" aria-labelledby="joystick-heading">
        <div class="card-top-bar">
          <h2 id="joystick-heading" class="panel-title mb-0">
            <i class="bi bi-joystick text-info" aria-hidden="true"></i>
            <span>Control de Dirección</span>
          </h2>
          <span id="active-command-badge" class="badge rounded-pill text-bg-secondary cmd-badge" aria-live="polite">
            Detener
          </span>
        </div>

        <div class="joystick-body">
          <!-- Contenedor Circular del Joystick -->
          <div class="joystick-wrapper">
            <div
              id="joystick-zone"
              class="joystick-base"
              role="application"
              aria-label="Joystick direccional"
              tabindex="0"
            >
              <span class="joystick-guide guide-up" aria-hidden="true"><i class="bi bi-caret-up-fill"></i></span>
              <span class="joystick-guide guide-right" aria-hidden="true"><i class="bi bi-caret-right-fill"></i></span>
              <span class="joystick-guide guide-down" aria-hidden="true"><i class="bi bi-caret-down-fill"></i></span>
              <span class="joystick-guide guide-left" aria-hidden="true"><i class="bi bi-caret-left-fill"></i></span>

              <div id="joystick-knob" class="joystick-knob">
                <i class="bi bi-arrows-move" aria-hidden="true"></i>
              </div>
            </div>
          </div>

          <!-- Píldoras de telemetría -->
          <div class="telemetry-bar">
            <div class="telemetry-chip">
              <span class="telemetry-label">Ángulo</span>
              <strong id="joystick-angle" class="telemetry-value">0°</strong>
            </div>
            <div class="telemetry-chip">
              <span class="telemetry-label">Potencia</span>
              <strong id="joystick-force" class="telemetry-value">0%</strong>
            </div>
            <div class="telemetry-chip">
              <span class="telemetry-label">Movimiento</span>
              <strong id="joystick-direction" class="telemetry-value text-info">Detener</strong>
            </div>
          </div>

          <!-- BOTÓN DE DETENER PRIORITARIO -->
          <button
            id="btn-emergency-stop"
            type="button"
            data-cmd-id="13"
            data-cmd-name="Detener"
            class="btn-stop-vehicle"
            aria-label="Detener vehículo inmediatamente"
          >
            <i class="bi bi-octagon-fill" aria-hidden="true"></i>
            <span>DETENER VEHÍCULO</span>
          </button>
        </div>
      </section>

      <!-- PANEL DERECHO / INFERIOR: FUNCIONES Y MODO DEMO -->
      <div class="panel-actions-wrapper">

        <!-- FUNCIONES DEL VEHÍCULO -->
        <section class="glass-card panel-controls" aria-labelledby="actions-heading">
          <div class="card-top-bar">
            <h2 id="actions-heading" class="panel-title mb-0">
              <i class="bi bi-sliders2 text-warning" aria-hidden="true"></i>
              <span>Funciones del Vehículo</span>
            </h2>
            <small id="dispatch-state-badge" class="badge rounded-pill text-bg-secondary cmd-badge">Listo</small>
          </div>

          <div id="commands-container" class="actions-grid">
            <button
              type="button"
              class="btn-action-cmd action-cyan span-3"
              data-cmd-id="3"
              data-cmd-name="Cabina Izquierda"
            >
              <i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i>
              <span>Cabina Izq.</span>
            </button>

            <button
              type="button"
              class="btn-action-cmd action-cyan span-3"
              data-cmd-id="4"
              data-cmd-name="Cabina Derecha"
            >
              <i class="bi bi-arrow-clockwise" aria-hidden="true"></i>
              <span>Cabina Der.</span>
            </button>

            <button
              type="button"
              class="btn-action-cmd action-amber span-3"
              data-cmd-id="7"
              data-cmd-name="Bajar Garra"
            >
              <i class="bi bi-arrow-down-circle-fill" aria-hidden="true"></i>
              <span>Bajar Garra</span>
            </button>

            <button
              type="button"
              class="btn-action-cmd action-amber span-3"
              data-cmd-id="8"
              data-cmd-name="Subir Garra"
            >
              <i class="bi bi-arrow-up-circle-fill" aria-hidden="true"></i>
              <span>Subir Garra</span>
            </button>

            <button
              type="button"
              class="btn-action-cmd action-neutral span-2"
              data-cmd-id="9"
              data-cmd-name="Luz"
            >
              <i class="bi bi-lightbulb-fill text-warning" aria-hidden="true"></i>
              <span>Luz</span>
            </button>

            <button
              type="button"
              class="btn-action-cmd action-neutral span-2"
              data-cmd-id="10"
              data-cmd-name="Sonido"
            >
              <i class="bi bi-volume-up-fill text-info" aria-hidden="true"></i>
              <span>Sonido</span>
            </button>

            <button
              type="button"
              class="btn-action-cmd action-neutral span-2"
              data-cmd-id="11"
              data-cmd-name="Velocidad"
            >
              <i class="bi bi-speedometer2 text-success" aria-hidden="true"></i>
              <span>Velocidad</span>
            </button>
          </div>
        </section>

        <!-- MODO DEMO -->
        <section class="glass-card panel-demo" aria-labelledby="demos-heading">
          <div class="card-top-bar">
            <h2 id="demos-heading" class="panel-title mb-0">
              <i class="bi bi-play-circle-fill text-success" aria-hidden="true"></i>
              <span>Secuencia Automática (DEMO)</span>
            </h2>
            <span id="demo-status-badge" class="badge rounded-pill text-bg-secondary cmd-badge" aria-live="polite">
              Inactivo
            </span>
          </div>

          <div class="demo-body">
            <select
              id="select-demo"
              class="form-select demo-select"
              aria-label="Seleccionar rutina DEMO"
            >
              <option value="1" selected>Demo principal</option>
            </select>
            <div class="demo-actions">
              <button
                id="btn-start-demo"
                type="button"
                class="btn-demo-start"
              >
                <i class="bi bi-play-fill" aria-hidden="true"></i>
                <span>Iniciar DEMO</span>
              </button>
              <button
                id="btn-cancel-demo"
                type="button"
                class="btn-demo-cancel"
              >
                <i class="bi bi-stop-fill" aria-hidden="true"></i>
                <span>Cancelar</span>
              </button>
            </div>
          </div>
        </section>

      </div>
    </div>
  </main>

  <!-- FOOTER OBLIGATORIO -->
  <footer class="app-footer">
    <small>Desarrollado por Jesús Sergio Quiroz Guzmán · 2026</small>
  </footer>

  <!-- Bootstrap 5.3 JS Bundle -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>
  <!-- Punto de entrada ES6 Module -->
  <script type="module" src="./assets/js/app.js?v=5"></script>
</body>
</html>
